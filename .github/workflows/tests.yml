# בדיקות אוטומטיות בכל דחיפה ובכל PR. בלי רשת ובלי סודות: ספוטיפיי מזויף בבדיקות
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # בדיקת קוד: שמות לא מוגדרים, ייבואים מיותרים ומפתחות כפולים (ruff.toml)
      - run: python -m ruff check .
      - run: python -m pytest
        env:
          PYTHONIOENCODING: utf-8
